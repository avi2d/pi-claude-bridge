name: setup
description: Installs the Bun that .bun-version pins and the locked dependencies, after the job checks out the repository.
runs:
  using: composite
  steps:
    - name: fetch Bun through npm where the image holds no unzip
      shell: bash
      run: bash .github/actions/setup/bun-without-unzip.sh
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version
    # A self-hosted runner keeps its Bun cache between jobs, where a restore only adds time.
    - if: runner.environment == 'github-hosted'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-
    - name: install the locked dependencies
      shell: bash
      run: bun install --frozen-lockfile
